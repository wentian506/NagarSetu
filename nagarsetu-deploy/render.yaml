# Render Blueprint. A persistent disk needs a paid instance type.
services:
  - type: web
    name: nagarsetu
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: nagarsetu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
